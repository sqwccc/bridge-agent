worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_x_forwarded_proto $forwarded_protocol {
        default $scheme;
        https https;
    }
    server {
        listen 18089;
        server_name _;
        root /app/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        location = /health/live {
            proxy_pass http://127.0.0.1:8088/actuator/health/liveness;
            access_log off;
        }
        location = /health/ready {
            proxy_pass http://127.0.0.1:8088/actuator/health/readiness;
            access_log off;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8088;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_protocol;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 200s;
        }
        location / { try_files $uri $uri/ /index.html; }
        location = /index.html { add_header Cache-Control "no-cache"; }
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }
    }
}
