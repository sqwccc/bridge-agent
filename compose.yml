name: bridgemind
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      APP_DB_URL: ${APP_DB_URL:?set APP_DB_URL}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      APP_DB_SCHEMA: ${APP_DB_SCHEMA:-public}
      SOURCE_DB_URL: ${SOURCE_DB_URL:?set SOURCE_DB_URL}
      SOURCE_DB_USER: ${SOURCE_DB_USER:?set SOURCE_DB_USER}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:?set SOURCE_DB_PASSWORD}
      SOURCE_DB_SCHEMA: ${SOURCE_DB_SCHEMA:-qiaoliang}
      REPORT_BASE_URL: ${REPORT_BASE_URL:-}
      TZ: Asia/Shanghai
      DIFY_BASE_URL: ${DIFY_BASE_URL:-http://host.docker.internal:8090/v1}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_DATA_MODE: ${DIFY_DATA_MODE:-demo}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [ CMD, wget, -q, --spider, http://localhost:8088/actuator/health ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8089}:80"
    depends_on:
      backend:
        condition: service_healthy
